<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fashion Accessories | Vellora Global Sourcing</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #FAF8F5;
      --bg-card: #FFFFFF;
      --border: rgba(0, 0, 0, 0.08);
      --maroon: #800020;
      --text-black: #000000;
      --text-muted: #555555;
      --font-serif: 'Playfair Display', serif;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-cream);
      color: var(--text-black);
      font-family: var(--font-sans);
      line-height: 1.6;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 1rem 1rem 3.5rem;
    }

    .page-header {
      padding: 1.5rem 0 2.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2.5rem;
    }

    .header-kicker {
      font-size: 0.75rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--maroon);
      margin-bottom: 0.6rem;
      display: block;
    }

    .header-title {
      font-family: var(--font-serif);
      font-size: clamp(2.2rem, 4.5vw, 3.8rem);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 0.8rem;
    }

    .header-title em {
      font-style: italic;
      font-weight: 400;
    }

    .header-desc {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 720px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
      margin-bottom: 3.5rem;
    }

    /* IN-PLACE CLICK ZOOM (Retail Inventory Style, NO ICON/INDICATOR) */
    .photo-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, z-index 0s;
      z-index: 1;
    }

    .photo-card.zoomed {
      transform: scale(1.6);
      z-index: 99999;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      border-color: var(--maroon);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .closing-statement {
      border-top: 1px solid var(--border);
      padding: 2.5rem 0 1rem;
      text-align: center;
    }

    .closing-text {
      font-family: var(--font-serif);
      font-size: clamp(1.2rem, 2vw, 1.5rem);
      margin-bottom: 1.2rem;
    }

    .closing-actions {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .contact-line {
      display: inline-flex;
      align-items: center;
      color: var(--text-black);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.92rem;
    }

    .contact-line:hover {
      color: var(--maroon);
    }

    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.55rem;
      }
      .photo-card.zoomed {
        transform: scale(1.4);
      }
      .closing-actions {
        flex-direction: column;
        gap: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">

      <h1 class="header-title">Fashion <em>Accessories</em></h1>

      <div class="photo-card" onclick="toggleZoom(this)"><img src="https://i.pinimg.com/736x/08/da/c1/08dac118797158b2ac909e070770e4f6.jpg" alt="Accessory" /></div>

    <div class="closing-statement">
      <div class="closing-text">Ready to scale your next accessory line with Vellora?</div>
      <div class="closing-actions">

        <a href="tel:+918796775766" class="contact-line">+91 87967 75766</a>
      </div>
    </div>
  </div>

  <script>
    function toggleZoom(card) {
      const isZoomed = card.classList.contains('zoomed');
      document.querySelectorAll('.photo-card').forEach(c => c.classList.remove('zoomed'));
      if (!isZoomed) {
        card.classList.add('zoomed');
      }
    }
  </script>
</body>
</html>
